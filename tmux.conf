# tmux config — agent workbench (2026-07)

# Mouse: click to focus panes, drag borders to resize, scroll in panes
set -g mouse on

# The server outlives its last session (2026-07-25). Default 'on' means: the
# moment the last session is destroyed the whole server exits — every pane,
# every hook, every other session with it, and the next wb-code has to build
# everything anew. Twice this morning that turned one lost session into a lost
# workbench. 'off' keeps the server up; wb-code then simply recreates the
# session in it.
set -g exit-empty off

# Bigger scrollback, truecolor, instant escape (no ESC lag in editors/agents)
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -s escape-time 0

# Pane titles visible so agents are identifiable — each pane gets a colored
# bullet (color = pane index) + role/name label; active pane border is green+bold
set -g pane-border-status top
set -g pane-border-format " #[fg=colour#{e|+|#{e|%|#{pane_index},6},2},bold]●#[default] #{?#{==:#{@wb_role},sidebar},DATEIEN,#{?#{==:#{@wb_role},orchestrator},◆ ORCHESTRATOR,#{pane_index} #{pane_title}}}#{?pane_active, ◀,} "
set -g pane-border-style "fg=colour246"
set -g pane-active-border-style "fg=colour114,bold"
set -g pane-border-lines heavy

# Auto-grid: whenever ANY split happens (incl. Claude agent-team teammates),
# rearrange into the predefined grid (sidebar left · orchestrator top · agents row)
#
# The window MUST be the one the event happened in. Measured on tmux 3.7b with a client
# attached to another session: for `pane-exited`, #{window_id} resolves to the ATTACHED
# CLIENT's window (@1) instead of the event's window (@0) — an exiting pane anywhere then
# re-grids whatever session the human is looking at. #{hook_window} is correct there (@0)
# but is empty for `after-split-window`, where #{window_id} is correct. The conditional
# below picks the right one per hook and was verified to yield @0 for BOTH.
set-hook -g after-split-window 'run-shell -b -d 1 "$HOME/.local/bin/wb-grid #{?hook_window,#{hook_window},#{window_id}}"'
set-hook -g pane-exited 'run-shell -b -d 1 "$HOME/.local/bin/wb-grid #{?hook_window,#{hook_window},#{window_id}}"'

# Numbering from 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings (prefix = Ctrl+B) ---
# Alt+arrows: move between panes WITHOUT prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Prefix + arrows held: resize pane
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up    resize-pane -U 3
bind -r C-Down  resize-pane -D 3
# a: new Claude agent pane (grid via wb-agent)
bind a run-shell '$HOME/.local/bin/wb-agent'
# Swap panes: < and >
bind -r < swap-pane -U
bind -r > swap-pane -D
# m: mark pane, M: swap marked pane with current (move any pane anywhere)
bind m select-pane -m
bind M swap-pane
# z (built-in): zoom pane fullscreen/back  |  q: show pane numbers

# --- Mouse-first controls ---
# Right-click in any pane: workbench menu (everything important per click)
#
# The two closing entries ask first (2026-07-25). They sit one stray right-click
# plus one click away from the orchestrator pane, kill-pane/kill-window ignore
# remain-on-exit, and the last pane of the last window takes the session — and
# with a worker-tab view session in the group, BOTH sessions — down with it.
# A running Claude conversation must never end that quietly.
bind -n MouseDown3Pane display-menu -T " Workbench " -x M -y M \
  "Neuer Agent (Claude)"      a "run-shell '$HOME/.local/bin/wb-agent'" \
  "Neuer lokaler Agent (pi)"  p "run-shell '$HOME/.local/bin/wb-pi'" \
  "" \
  "Grid ordnen"               g "run-shell '$HOME/.local/bin/wb-grid'" \
  "Pane Vollbild an/aus"      z "resize-pane -Z" \
  "" \
  "Pane markieren"            m "select-pane -m" \
  "Mit markiertem tauschen"   M "swap-pane" \
  "" \
  "Pane schliessen"           x "confirm-before -p 'Pane #P wirklich schliessen? (y/n)' kill-pane" \
  "Fenster schliessen"        X "confirm-before -p 'Fenster #W mit allen Panes schliessen? (y/n)' kill-window" \
  "Eigene Session schliessen" S "confirm-before -p \"Eigene Session '#{?session_group,#{session_group},#{session_name}}' schliessen (inkl. Sicht)? (y/n)\" \"run-shell 'WB_SESSION_CLOSE_CONFIRM=#{?session_group,#{session_group},#{session_name}} $HOME/.local/bin/wb-session-close --self'\""
# Left-click on the [+ Menu] in the status bar: same menu
bind -n MouseDown1StatusLeft display-menu -T " Workbench " -x M -y S \
  "Neuer Agent (Claude)"      a "run-shell '$HOME/.local/bin/wb-agent'" \
  "Neuer lokaler Agent (pi)"  p "run-shell '$HOME/.local/bin/wb-pi'" \
  "Grid ordnen"               g "run-shell '$HOME/.local/bin/wb-grid'" \
  "Pane Vollbild an/aus"      z "resize-pane -Z" \
  "Pane schliessen"           x "confirm-before -p 'Pane #P wirklich schliessen? (y/n)' kill-pane"

# Status bar: minimal, clickable menu hint left
set -g status-style "bg=#1f2430,fg=#a6accd"
set -g status-left "#[bold] #S #[fg=#7fd962][+ Menu] "
set -g status-left-length 40
set -g status-right "#{session_windows}w #{window_panes}p  %H:%M "

# no visual dimming of inactive panes
set -g window-style ""
set -g window-active-style ""
set -g extended-keys on
set -g extended-keys-format csi-u

# Revive a dead claude pane (jetsam/OOM) — respawn + resume conversation.
# Manual: prefix + R. Automatic: the pane-died hook below.
bind-key R run-shell "wb-revive '#{pane_id}'"

# Prefix + S: die eigene Workbench-Session schliessen, samt gruppierter '-view'-
# Schwester. Ein geschlossenes VS-Code-Fenster beendet die Session NICHT — sie
# laeuft unsichtbar weiter und haelt ihren Claude-Prozess im Speicher (am
# 2026-08-03 waren so 27 Sessions mit 7,5 GB offen). Das hier ist der bewusste
# Weg, eine Session zu beenden. `wb-session-close --self` fragt vorher, verweigert
# bei laufenden Workern und notiert, wie die Session wiederherzustellen ist.
# Die Bestaetigung traegt IMMER den Namen der Basis-Session: bei einer gruppierten
# Session liefert #{session_group} bei beiden Mitgliedern den Basisnamen.
bind-key S confirm-before -p "Eigene Session '#{?session_group,#{session_group},#{session_name}}' schliessen (inkl. Sicht)? (y/n)" \
  "run-shell 'WB_SESSION_CLOSE_CONFIRM=#{?session_group,#{session_group},#{session_name}} $HOME/.local/bin/wb-session-close --self'"

# Auto-revive: when a pane with remain-on-exit dies (jetsam/OOM SIGKILL), bring
# it back by itself instead of leaving a dead, un-interactable "frozen" pane.
# wb-autorevive guards against respawn storms (memory-pressure check) and crash
# loops (per-pane throttle); it no-ops on non-claude panes. -b so tmux stays
# responsive while it runs.
set-hook -g pane-died 'run-shell -b "$HOME/.local/bin/wb-autorevive #{hook_pane}"'
