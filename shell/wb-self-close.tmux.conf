# Schnipsel fuer ~/.tmux.conf — Knopf fuer 'wb-session-close --self'.
#
# NICHT INSTALLIERT: dieses Schnipsel wird nie als eigene Datei ausgerollt,
# sondern von Hand in ~/.tmux.conf eingefuegt (siehe unten) -- gehoert deshalb
# nicht nach ~/.local/bin.
#
# NUR EINFUEGEN, NICHT ausfuehren oder automatisch einbinden — der Worker, der
# das hier gebaut hat, durfte ~/.tmux.conf nicht selbst anfassen. Zwei Saetze,
# wie der Nutzer es installiert: die beiden Bloecke unten von Hand an den
# passenden Stellen in ~/.tmux.conf einfuegen (Bindung nach der bestehenden
# 'bind-key R ...'-Zeile, Menue-Eintrag im MouseDown3Pane-Menue vor der
# schliessenden Zeile mit "Fenster schliessen"), dann `tmux source-file
# ~/.tmux.conf` in einer laufenden Session, um es ohne Neustart zu laden.
#
# Warum ein eigener Knopf statt einfach 'X' (Fenster schliessen): 'X' schliesst
# nur das aktuelle Fenster, nicht die ganze Session samt gruppierter
# '-view'-Schwester, und prueft nicht auf laufende Worker. 'wb-session-close
# --self' tut genau das — mit denselben Sicherheitspruefungen wie beim
# Schliessen fremder Sessions (siehe shell/wb-session-close).
#
# Die Bestaetigung WB_SESSION_CLOSE_CONFIRM=<eigene Basis-Session> wird hier
# aus dem tmux-Format selbst gebaut: '#{?session_group,#{session_group},#{session_name}}'
# liefert fuer eine gruppierte Session (Basis + '-view') in BEIDEN Faellen den
# Namen der Basis (gemessen 2026-08-03: #{session_group} traegt bei beiden
# Mitgliedern einer Gruppe den Namen der Basis), fuer eine ungruppierte Session
# ihren eigenen Namen. Damit passt die Bestaetigung immer zur Basis, egal ob
# der Tastendruck im Basis- oder im Sicht-Fenster erfolgt.

# --- Tastenbindung: einfuegen z.B. direkt nach 'bind-key R run-shell ...' ---
# Prefix + S: eigene Workbench-Session schliessen (mit gruppierter Sicht).
# Fragt zuerst per confirm-before nach, verweigert danach zusaetzlich, wenn
# noch ein Worker-Pane laeuft (dann zuerst 'wb-close <name>').
bind-key S confirm-before -p "Eigene Session '#{?session_group,#{session_group},#{session_name}}' schliessen (inkl. Sicht)? (y/n)" \
  "run-shell 'WB_SESSION_CLOSE_CONFIRM=#{?session_group,#{session_group},#{session_name}} $HOME/.local/bin/wb-session-close --self'"

# --- Menue-Eintrag: einfuegen in den bestehenden MouseDown3Pane-Block, vor
#     der Zeile "Fenster schliessen" (gleiche Spalten-Ausrichtung wie dort) ---
#   "Eigene Session schliessen"  S "confirm-before -p \"Eigene Session '#{?session_group,#{session_group},#{session_name}}' schliessen (inkl. Sicht)? (y/n)\" \"run-shell 'WB_SESSION_CLOSE_CONFIRM=#{?session_group,#{session_group},#{session_name}} $HOME/.local/bin/wb-session-close --self'\"" \
#
# Kompletter Block zum Ersetzen (Original in ~/.tmux.conf, Zeilen 74-85):
#
# bind -n MouseDown3Pane display-menu -T " Workbench " -x M -y M \
#   "Neuer Agent (Claude)"      a "run-shell '$HOME/.local/bin/wb-agent'" \
#   "Neuer lokaler Agent (pi)"  p "run-shell '$HOME/.local/bin/wb-pi'" \
#   "" \
#   "Grid ordnen"               g "run-shell '$HOME/.local/bin/wb-grid'" \
#   "Pane Vollbild an/aus"      z "resize-pane -Z" \
#   "" \
#   "Pane markieren"            m "select-pane -m" \
#   "Mit markiertem tauschen"   M "swap-pane" \
#   "" \
#   "Pane schliessen"           x "confirm-before -p 'Pane #P wirklich schliessen? (y/n)' kill-pane" \
#   "Fenster schliessen"        X "confirm-before -p 'Fenster #W mit allen Panes schliessen? (y/n)' kill-window" \
#   "Eigene Session schliessen" S "confirm-before -p \"Eigene Session '#{?session_group,#{session_group},#{session_name}}' schliessen (inkl. Sicht)? (y/n)\" \"run-shell 'WB_SESSION_CLOSE_CONFIRM=#{?session_group,#{session_group},#{session_name}} $HOME/.local/bin/wb-session-close --self'\""
