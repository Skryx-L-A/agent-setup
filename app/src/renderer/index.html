<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- 'frame-src awb-seite:' ist der EINZIGE Zusatz fuer die uebernommenen Seiten
         (Schritt 7). Sie sind vollstaendige Dokumente mit EIGENER CSP; laegen sie in
         einem about:blank-Rahmen, erbten sie DIESE hier, und ihr 'script-src
         nonce-...' waere wirkungslos -- die Seiten stuenden da, ohne dass ein Knopf
         etwas taete (gemessen 05.08.). Mit eigenem Schema haben sie ihre eigene
         Herkunft und ihre eigene CSP, so wie im Webview. 'script-src' bleibt hier
         unangetastet streng: dieses Fenster fuehrt nur sein eigenes Buendel aus. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src awb-seite:" />
    <title>Agent Workbench</title>
    <!-- DAS TOKEN-SYSTEM, an einer Stelle: main/thema.ts (ROLLEN, rollenCss())
         erzeugt diese Datei bei jedem Bau (build.mjs), identisch in allen fuenf
         Fenstern. Sie traegt `:root` (dunkel, Vorgabe) UND `:root[data-thema=
         'hell']` vollstaendig -- niemand hier schreibt noch eine Hex-Farbe.
         `data-thema` traegt IMMER den AUFGELOESTEN Wert ('hell'/'dunkel', nie
         'system'); main/thema.ts loest 'system' ueber `nativeTheme` auf. Sie
         steht VOR renderer.css, damit die Gestalt darauf aufbauen kann. -->
    <link rel="stylesheet" href="tokens.css" />
    <!-- Die Gestalt selbst. Sie entsteht beim Bau aus den CSS-Dateien, die der
         Renderer einliest -- werkbank.css zuerst, danach die Blaetter. -->
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <!-- BESCHRIFTUNGEN STEHEN HIER NICHT. Jedes Element traegt statt seiner
         Aufschrift ein `data-text` mit dem Schluessel aus renderer/texte.ts;
         `beschriftungenSetzen()` in renderer.ts fuellt Aufschrift und `title`,
         sobald die Sprache feststeht. Bis dahin bleibt das <span> leer -- das
         ist der Zustand von wenigen Millisekunden beim Start und immer noch
         besser als eine Aufschrift, die erst deutsch ist und dann englisch. -->
    <div id="rahmen">

      <!-- DIE TITELLEISTE WIRD BENUTZT. Links (nach dem freien Streifen fuer
           die drei Fensterknoepfe) steht, WO man ist: Projekt und Sitzung, mit
           dem Zustandspunkt davor. Mittig der Ort der Arbeitsmodi. Rechts das
           Freigabe-Abzeichen und der Inspektorschalter.

           WAS HIER SEIT DEM 05.09.2026 NICHT MEHR STEHT (Regelbruch 4):
           Maschinenname und Zustand als Wort. Beides steht schon im
           Inhaltskopf und in den Maschinenkarten links, und bei schmalem Fenster
           kostete es genau den Platz, den der Titel brauchte. Uebrig bleibt
           `#k-neben` fuer den einen Fall, in dem die Maschine etwas
           unterscheidet: eine Sitzung auf einer FREMDEN. -->
      <header id="titelleiste">
        <div id="kontext">
          <span class="punkt ruhig" id="k-punkt"></span>
          <span id="k-projekt"></span>
          <span class="teiler" id="k-teiler">/</span>
          <span id="k-orch"></span>
          <span id="k-neben"></span>
        </div>

        <!-- DER UMSCHALTER TUT SEIT DEM 08.09.2026 ETWAS (Auftrag macagents).
             alice hat „Agent/Code" in seinem Vorbild unterstrichen und am
             08.09. festgestellt, dass es den Schalter nicht gibt. Seit dem
             14.09.2026 (Auftrag agentsui Nr. 6) legt „Agents" die Welten der
             Agents ueber das Fenster (welten-view.ts); den dritten Modus
             „Welten" aus der Vorab-Fassung gibt es nicht mehr. -->
        <div class="segment modi" id="modi" role="tablist">
          <button id="modus-code" role="tab" data-modus="code" data-text="modus.code" data-text-title="modus.code.tipp"></button>
          <button id="modus-agents" role="tab" data-modus="agents" data-text="modus.agents" data-text-title="modus.agents.tipp"></button>
        </div>

        <div id="titel-rechts">
          <!-- Der Knopf traegt `data-tot="freigaben"`, weil freigaben-view.ts
               daran haengt (es sucht genau diesen Waehler) und der Steuerkanal
               ihn ueber `awb-ctl klick freigaben` anspricht. Seine Gestalt ist
               neu, seine Verdrahtung nicht. -->
          <button class="knopf" id="freigabe-abzeichen" data-tot="freigaben" data-text-title="freigabe.abzeichen" hidden>
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M8 2.6l5.4 9.4H2.6z" /><path d="M8 6.4v2.6M8 10.8v.1" />
            </svg>
            <span class="zahl"></span>
          </button>
          <button class="knopf-schlicht" id="insp-knopf" aria-pressed="true" data-text-title="inspektor.schalter">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2" /><path d="M10.2 2.6v10.8" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Ohne Steuerkanal laeuft das Fenster weiter -- aber es sagt es, und zwar
           quer ueber die volle Breite. Bis zum Neubau lag diese Meldung IN der
           Pane-Flaeche und damit an einer Stelle, die von der gewaehlten
           Sitzung abhing; sie betrifft aber das ganze Programm, so wie die
           Freigabeleiste darunter. -->
      <div id="kanalwarnung"></div>

      <!-- Quer ueber die volle Breite, und nur da, wenn wirklich etwas offen
           ist: eine Freigabe ist an jedem Ort der Oberflaeche sichtbar. -->
      <div id="freigabeleiste"></div>

      <div id="app">
        <nav id="links">
          <div class="leiste-kopf">
            <span class="titel" data-text="leiste.projekte"></span>
            <button id="neue-session" data-text="leiste.neu">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M8 3.5v9M3.5 8h9" />
              </svg><span class="beschriftung"></span>
            </button>
          </div>
          <div id="sessions"></div>
          <!-- DIE MASCHINEN, JE EINE KARTE (05.09.2026, Wort des Nutzers
               „Maschinen prominenter"). Bis dahin standen sie als Punkte in der
               Statusleiste, und die Auskunft dahinter -- Erreichbarkeit,
               Sitzungen, Worker, Pruefstand -- war nur nach einem Klick zu
               sehen. Jetzt steht beides dauerhaft da, ohne Klick, ueber der
               Fusszeile. fuss-status.ts zeichnet die Karten. -->
          <div id="maschinen"></div>

          <!-- DIE FUSSZEILE DER LINKEN LEISTE (05.09.2026, Wort des Nutzers
               „Statusleiste nicht unten"). Sie stand bis dahin quer ueber die
               volle Breite unter allen drei Spalten; jetzt ist sie der Fuss der
               linken Karte, und die Buehne reicht bis zum unteren Fensterrand.
               Was sie zeigt, ist unveraendert: Verbrauch, Wochenstand, die Zahl
               laufender Worker, das Zahnrad. Die Maschinen stehen als Karten
               darueber. `awb-ctl ui` liefert dieselben Felder wie vorher. -->
          <footer id="statusleiste">
            <div id="fuss"></div>
            <div class="rechts">
              <div class="stueck" id="st-worker"></div>
              <button class="knopf" data-tot="einstellungen" data-text="leiste.einstellungen">
                <!-- Ein Zahnrad, keine Sonne. Geschlossener Umriss: Kopfkreis 8,
                     Fusskreis 6,1, acht Zaehne, dazu die Nabe. Der Umriss ist
                     gerechnet, damit Flanken und Luecken gleich breit sind; von
                     Hand gesetzte Zahlen lassen ein Zahnrad bei 20 Bildpunkten
                     schief aussehen. -->
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                  <path d="M8.41 2.16A8 8 0 0 1 11.59 2.16L11.58 4.11A6.1 6.1 0 0 1 13.05 4.72L14.42 3.33A8 8 0 0 1 16.67 5.58L15.28 6.95A6.1 6.1 0 0 1 15.89 8.42L17.84 8.41A8 8 0 0 1 17.84 11.59L15.89 11.58A6.1 6.1 0 0 1 15.28 13.05L16.67 14.42A8 8 0 0 1 14.42 16.67L13.05 15.28A6.1 6.1 0 0 1 11.58 15.89L11.59 17.84A8 8 0 0 1 8.41 17.84L8.42 15.89A6.1 6.1 0 0 1 6.95 15.28L5.58 16.67A8 8 0 0 1 3.33 14.42L4.72 13.05A6.1 6.1 0 0 1 4.11 11.58L2.16 11.59A8 8 0 0 1 2.16 8.41L4.11 8.42A6.1 6.1 0 0 1 4.72 6.95L3.33 5.58A8 8 0 0 1 5.58 3.33L6.95 4.72A6.1 6.1 0 0 1 8.42 4.11L8.41 2.16Z" />
                  <circle cx="10" cy="10" r="2.6" />
                </svg><span class="beschriftung"></span>
              </button>
            </div>
          </footer>
        </nav>

        <div id="griff"></div>

        <main id="mitte">
          <!-- DER INHALTSKOPF (04.09.2026) -- das Stueck, das fehlte. Links
               steht, woran gearbeitet wird: der Sitzungsname gross, darunter
               klein Harness, Modell und Ordner. Rechts steht, was laeuft und
               was die Flaeche zeigt: die Statuspille mit der Zahl laufender
               Worker, der Umschalter Orchestrator/Worker und das Zahnrad
               DIESER Sitzung.

               Die BUEHNE entscheidet ueber den Streifen darunter: er steht nur
               da, wenn wenigstens ein Worker-Pane gezeichnet ist. Liegt der
               Orchestrator darauf, oder hat die Sitzung keine Worker, gibt es
               nichts zu kacheln -- weder Tabs noch Ansichtsschalter stehen
               dann da, und der Kopf ist in jeder Sitzung gleich hoch. -->
          <div id="inhaltskopf">
            <div id="ik-links">
              <div id="ik-name"></div>
              <div id="ik-herkunft"></div>
            </div>
            <div id="ik-rechts">
              <!-- DIE PILLE IST EIN KNOPF (04.09.2026, Befund 11 der
                   Inventur). Die Worker-Liste kostet seit dem Neubau die
                   Buehne: sie steht in der Uebersicht, und die Uebersicht
                   ERSETZT das Terminalbild. Die Frage „wo sehe ich meine
                   Worker, ohne die Panes aufzugeben" braucht trotzdem eine
                   Antwort, und sie steht dort, wo die Zahl schon steht. Ein
                   Klick klappt die Liste als Blatt darunter auf. -->
              <button class="statuspille" id="ik-worker" aria-expanded="false" data-text-title="flaeche.workerLaufen.tipp">
                <span class="punkt ruhig"></span><span class="zahl"></span>
              </button>
              <div class="segment wahl-akzent" id="ik-modus" role="tablist" data-text-title="flaeche.modus">
                <button id="ik-modus-orch" role="tab" data-flaeche="orchestrator" data-text="flaeche.orchestrator"></button>
                <button id="ik-modus-worker" role="tab" data-flaeche="worker" data-text="flaeche.worker"></button>
              </div>
              <button id="ik-zahnrad" aria-expanded="false" data-text-title="sitzungskarte.oeffnen">
                <!-- Dasselbe gerechnete Zahnrad wie in der Fusszeile, nur
                     kleiner: gleiche Bedeutung, gleiche Zeichnung. -->
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                  <path d="M8.41 2.16A8 8 0 0 1 11.59 2.16L11.58 4.11A6.1 6.1 0 0 1 13.05 4.72L14.42 3.33A8 8 0 0 1 16.67 5.58L15.28 6.95A6.1 6.1 0 0 1 15.89 8.42L17.84 8.41A8 8 0 0 1 17.84 11.59L15.89 11.58A6.1 6.1 0 0 1 15.28 13.05L16.67 14.42A8 8 0 0 1 14.42 16.67L13.05 15.28A6.1 6.1 0 0 1 11.58 15.89L11.59 17.84A8 8 0 0 1 8.41 17.84L8.42 15.89A6.1 6.1 0 0 1 6.95 15.28L5.58 16.67A8 8 0 0 1 3.33 14.42L4.72 13.05A6.1 6.1 0 0 1 4.11 11.58L2.16 11.59A8 8 0 0 1 2.16 8.41L4.11 8.42A6.1 6.1 0 0 1 4.72 6.95L3.33 5.58A8 8 0 0 1 5.58 3.33L6.95 4.72A6.1 6.1 0 0 1 8.42 4.11L8.41 2.16Z" />
                  <circle cx="10" cy="10" r="2.6" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Die Tab-Leiste sitzt ueber der Pane-Flaeche: waagerecht ueber den
               Kacheln steht das Etikett dort, wo das Etikettierte liegt. Rechts
               daneben der Wechsel zwischen den drei Ansichten -- Ort und
               Wechsel an EINER Stelle, nicht an zweien. -->
          <div id="tabstreifen">
            <div id="tabs" role="tablist" aria-label="Worker-Tabs"></div>
            <!-- DIE KACHELFORM STEHT BEI DER BUEHNE (05.09.2026, Kleinigkeit
                 4). Sie stand bis dahin unten im Inspektor -- „6 Panes je Tab ·
                 2×3" --, und der Inspektor zeigt Ordner, Aktivitaet und
                 Protokolle: nichts davon hat mit der Kachelung zu tun. Jetzt
                 steht sie im Streifen ueber den Kacheln, neben dem Schalter,
                 der die Ansicht wechselt. Der ganze Satz bleibt im
                 Hilfeschildchen. -->
            <div id="hinweis" hidden></div>
            <!-- HIER STAND EIN PLUS (bis 04.09.2026, Befund 13 der Inventur).
                 Es trug das Schildchen „Neuen Tab anlegen" und loeste genau
                 dasselbe aus wie das Plus ueber den Sitzungen: das
                 Sitzungsfenster. Einen Tab legte es nie an, und es kann auch
                 keinen anlegen -- ein Tab entsteht aus Workern, nicht aus
                 einem Knopf: `capacity.tabs` faellt aus der Zahl der Worker
                 und der Kapazitaet je Tab. Ein LEERER Tab haette nichts, was
                 er zeigen koennte. Ein Knopf, der etwas anderes tut, als er
                 sagt, bleibt nicht; das Plus in der Leiste tut dasselbe und
                 steht dort richtig. -->
            <div class="streifen-rechts">
              <div class="segment" id="lage" role="tablist" aria-label="Ansicht">
                <button id="lage-uebersicht" role="tab" data-lage="uebersicht" data-text="lage.uebersicht"></button>
                <button id="lage-gekachelt" role="tab" data-lage="gekachelt" data-text="lage.gekachelt"></button>
                <button id="lage-gezoomt" role="tab" data-lage="gezoomt" data-text="lage.gezoomt"></button>
              </div>
              <button id="ordnen" data-text="lage.ordnen"></button>
            </div>
          </div>

          <div id="buehne">
            <!-- Was die Buehne sagt, wenn nichts auf ihr liegt. Eine ruhige
                 Zeile, kein Kasten: sie soll den Blick fuehren und nicht wie
                 eine Meldung aussehen, die man wegklicken muss. -->
            <div id="leer" data-text="leer.buehne"></div>
            <div id="pane"></div>
            <div id="gitter"></div>
            <div id="uebersicht"></div>
            <div id="chatbuehne"></div>
            <div id="notiz"></div>
            <!-- DIE SITZUNGSKARTE hinter dem Zahnrad im Inhaltskopf. Sie
                 liegt als Blatt ueber der Flaeche, an derselben Stelle, an der
                 das Zahnrad steht -- kein eigenes Fenster fuer fuenf Angaben
                 und vier Griffe. Was sie zeigt, steht im Modell; was sie tut,
                 laeuft ueber dieselben Wege wie das Kontextmenue der Zeile.
                 Das globale Zahnrad in der Fusszeile der linken Leiste bleibt, wo es ist. -->
            <!-- Die Worker-Liste hinter der Pille. Sie liegt als Blatt
                 UEBER der Flaeche und nimmt ihr nichts weg -- anders als die
                 Uebersicht, die eine der drei Ansichten ist. -->
            <div id="workerliste"></div>

            <div id="sitzungskarte">
              <div class="sk-kopf">
                <span class="sk-titel" data-text="sitzungskarte.titel"></span>
                <button type="button" id="sk-zu" data-text-title="wort.schliessen">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
                  </svg>
                </button>
              </div>
              <div class="sk-feld">
                <label class="sk-was" for="sk-name" data-text="sitzungskarte.name"></label>
                <div class="sk-eingabe">
                  <input id="sk-name" type="text" data-tipp="sitzungsname" spellcheck="false" />
                  <button type="button" id="sk-name-ok" class="knopf-voll" data-text="sitzungskarte.uebernehmen"></button>
                </div>
              </div>
              <dl class="sk-liste" id="sk-liste"></dl>
              <div class="sk-knoepfe" id="sk-knoepfe"></div>
            </div>

            <div id="umbenennen">
              <div class="kopf" data-text="umbenennen.titel"></div>
              <div class="alt" id="umbenennen-alt"></div>
              <div class="fuss">
                <input id="umbenennen-feld" type="text" data-tipp="umbenennen" spellcheck="false" />
                <button type="button" id="umbenennen-ok" class="start" data-text="umbenennen.ok"></button>
                <button type="button" id="umbenennen-ab" data-text="umbenennen.ab"></button>
              </div>
            </div>
          </div>
        </main>

        <div id="griff-rechts" hidden></div>

        <!-- Der Inspektor: drei Blaetter, die man kurz nachschlaegt und wieder
             wegklickt. Die Freigaben liegen bewusst NICHT hier -- sie stehen
             oben, quer und immer sichtbar.

             ANFANGS ZU (05.09.2026, Electron-Befund 1): die Spalte gibt es nur,
             solange ein Blatt offen steht, und beim Start steht keines offen.
             Ohne dieses `hidden` staende sie fuer die wenigen Bilder bis zum
             ersten Modell da und verschwaende dann -- genau das Flackern, das
             der Neubau sonst vermeidet. -->
        <aside id="rechts" hidden>
          <!-- Jeder Reiter traegt sein Symbol: ein gezeichneter Umriss von
               16 Bildpunkten, gedaempft, im gewaehlten Reiter im Akzent. In
               einer schmal gezogenen Leiste bleibt es allein stehen -- dann
               traegt es die Auskunft, die sonst die Aufschrift traegt. -->
          <div class="insp-reiter">
            <button class="knopf" data-tot="ordner" data-text="leiste.ordner">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
                <path d="M1.9 12.4V3.6h4l1.4 1.7h6.8v7.1z" />
              </svg><span class="beschriftung"></span>
            </button>
            <button class="knopf" data-tot="aktivitaet" data-text="leiste.aktivitaet">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.8 8h2.7l1.6-4.3 2.4 8.6L10.1 8h4.1" />
              </svg><span class="beschriftung"></span>
            </button>
            <button class="knopf" data-tot="protokolle" data-text="leiste.protokolle">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3.4 2.4h6l3.2 3.2v8H3.4z" /><path d="M9.2 2.4v3.4h3.4M5.6 9h4.8M5.6 11.2h3.2" />
              </svg><span class="beschriftung"></span>
            </button>
          </div>
          <div id="insp-bereich"></div>
          <div id="schublade"></div>
          <div id="rechtsliste"></div>
        </aside>
      </div>

      <!-- Der Platz des Freigabe-Blattes. Es liegt als Blatt UEBER der Flaeche
           und nicht im Inspektor: eine offene Freigabe soll an jedem Ort
           sichtbar sein, und eine zuklappbare Leiste kann das nicht halten. -->
      <div id="freigaben-platz"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
