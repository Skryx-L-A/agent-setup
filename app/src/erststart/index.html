<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Dieselbe Strenge wie in den anderen Fenstern: nur das eigene Buendel, nichts aus dem
         Netz, kein Rahmen. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:"
    />
    <title>Agent Workbench — First Steps</title>
    <!-- DAS TOKEN-SYSTEM, an einer Stelle: main/thema.ts (ROLLEN, rollenCss()),
         identisch in allen fuenf Fenstern. -->
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* Zwei eigene Namen fuer bestehende Rollen (gut/schlecht statt laeuft/aus
         -- diese Seite prueft Vorbedingungen, keine Sitzungszustaende), aus
         tokens.css uebernommen statt ein zweites Mal als Hex geschrieben. */
      :root {
        --gut: var(--laeuft);
        --schlecht: var(--aus);
      }
      /* `data-thema` traegt den von main/thema.ts AUFGELOESTEN Wert
         ('hell'/'dunkel'), gesetzt in erststart.ts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--grund);
        color: var(--schrift);
      }
      body {
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #kopf {
        flex: 0 0 auto;
        padding: 16px 26px 10px;
        border-bottom: 1px solid var(--linie);
        background: var(--leiste);
      }
      #kopf h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 3px;
      }
      #kopf .unterzeile {
        color: var(--gedaempft);
        margin: 0;
      }
      #fortschritt {
        margin-top: 8px;
        color: var(--gedaempft);
      }
      #inhalt {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 18px 26px 24px;
      }
      #inhalt h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #inhalt .unterzeile {
        color: var(--gedaempft);
        margin: 0 0 14px;
      }
      .hinweis {
        color: var(--gedaempft);
        margin: 8px 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }
      .chip {
        font: inherit;
        text-align: left;
        background: transparent;
        color: var(--schrift);
        border: 1px solid var(--linie);
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .chip:hover {
        background: var(--erhoben);
      }
      .chip.gewaehlt {
        border-color: var(--akzent);
        color: var(--akzent-text);
        background: var(--wahl);
      }
      .chip .zeichen {
        margin-right: 6px;
      }
      .chip .zeichen.ja {
        color: var(--gut);
      }
      .chip .zeichen.nein {
        color: var(--schlecht);
      }
      .grund {
        color: var(--gedaempft);
        margin: -4px 0 10px;
      }

      /* --- Das Kontextfenster, zweite Frage des dritten Schritts ---------
         Sie steht nur bei einem Modell, das hier auf der Maschine laeuft.
         NICHTS ist gesperrt: eine Stufe, fuer die der Speicher gerade nicht
         reicht, sieht genauso waehlbar aus, wie sie es ist, und traegt ihren
         Hinweis in der zweiten Zeile. */
      .kontextblock {
        margin-top: 18px;
      }
      .kontextblock h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .kontextliste {
        border: 1px solid var(--linie);
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        margin-top: 10px;
      }
      .kontexteintrag {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        background: transparent;
        color: var(--schrift);
        border: 0;
        border-bottom: 1px solid var(--linie);
        padding: 6px 10px;
        cursor: pointer;
      }
      .kontexteintrag:last-child {
        border-bottom: 0;
      }
      .kontexteintrag:hover {
        background: var(--wahl);
      }
      .kontexteintrag.gewaehlt {
        background: var(--wahl);
        color: var(--akzent-text);
      }
      .kontexteintrag .zeile1 {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .kontexteintrag.gewaehlt .zeile1 {
        font-weight: 600;
      }
      .kontexteintrag .kennung {
        color: var(--gedaempft);
        margin-left: auto;
      }
      .kontexteintrag .zeile2 {
        color: var(--gedaempft);
        margin-top: 1px;
      }
      /* Der Rang der empfohlenen Stufe -- ein Wort, kein Symbol, kein Emoji. */
      .kontexteintrag .marke {
        border-radius: 3px;
        padding: 0 5px;
        background: var(--gut);
        color: var(--grund);
        font-weight: 600;
      }
      /* Der Hinweis auf knappen Speicher. Er faerbt, er sperrt nicht. */
      .kontexteintrag .zeile2.kontexthinweis {
        color: var(--schlecht);
      }
      #fuss {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 26px;
        border-top: 1px solid var(--linie);
        background: var(--leiste);
      }
      .knopf {
        font: inherit;
        background: transparent;
        color: var(--schrift);
        border: 1px solid var(--linie);
        border-radius: 4px;
        padding: 6px 16px;
        cursor: pointer;
      }
      .knopf:hover {
        background: var(--erhoben);
      }
      .knopf.hervor {
        border-color: var(--akzent);
        color: var(--akzent-text);
      }
      .zusammenfassung {
        margin: 6px 0 14px;
      }
      .zusammenfassung li {
        margin: 2px 0;
      }
    </style>
  </head>
  <body>
    <header id="kopf">
      <h1 id="titel"></h1>
      <p class="unterzeile" id="kopf-unterzeile"></p>
      <p id="fortschritt"></p>
    </header>
    <main id="inhalt"></main>
    <div id="fuss">
      <button class="knopf" id="knopf-ueberspringen"></button>
      <button class="knopf hervor" id="knopf-weiter"></button>
    </div>
    <script src="erststart.js"></script>
  </body>
</html>
