[project]
name = "gardener"
version = "0.1.0"
description = "Brain-Gardener: nightly local sleep-cycle for the Knowledge vault (linking, consolidation, maintenance, audit)"
requires-python = ">=3.11"
dependencies = []

# Bewusst leer oben, bewusst optional hier: das Werkzeug laeuft ohne jede
# fremde Bibliothek. numpy beschleunigt nur die Gruppierung im Abgleich, und
# zwar erheblich - am echten Bestand von 27.980 Aussagen 15,1 s statt knapp
# vier Stunden (gemessen 16.08.2026). Fehlt es, rechnet dieselbe Vorschrift in
# reinem Python weiter; `tests/test_dream_reconcile_numpy.py` haelt beide Wege
# auf identische Ergebnisse fest.
[project.optional-dependencies]
schnell = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gardener = "gardener.cli:main"
dream = "gardener.dream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gardener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
