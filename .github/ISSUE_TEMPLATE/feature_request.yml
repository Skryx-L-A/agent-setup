name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and why that matters to you.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Alternatives you considered are welcome.
    validations:
      required: false
