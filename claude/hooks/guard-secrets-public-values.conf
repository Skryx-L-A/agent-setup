# bash-guard-secrets: bekannte OEFFENTLICHE Werte, die die Inhaltspruefung nicht melden soll.
#
# Vergleich NUR ueber den genauen Wert: je Zeile der SHA-256 der exakten Zeichenkette, die
# das Muster gefunden hat (nicht der Klartext, nie ein Muster). Ein Wert mit einem
# geaenderten, fehlenden oder zusaetzlichen Zeichen hat einen anderen Hash und wird gemeldet.
# Format: <sha256-hex>  <Name>  <Quelle>. Leere Zeilen und '#' werden ignoriert. Fehlt die
# Datei: keine Ausnahme (es wird mehr gemeldet, nie weniger).
#
# Eintrag 2026-10-09 (Entscheidung Management-Sitzung): die oeffentlichen InnerTube-API-
# Schluessel von YouTube fuer die Clients WEB, ANDROID und IOS. Sie stecken in jedem
# Browser-/App-Client, sind nicht rotierbar und kein Geheimnis (Fund im Scan:
# a machine-bound project yt_transcripts3.py, Muster google_api_key).
# Quelle: yt-dlp, Datei yt_dlp/extractor/youtube.py, Tag 2023.12.30 (Commit
# 9f40cd289665b2fb8a05ccaf9721b3b2ca0f39c7), INNERTUBE_CLIENTS: 'web' Zeile 72,
# 'android' Zeile 113, 'ios' Zeile 167. In yt-dlp master stehen die Werte nicht mehr im
# Quelltext (yt_dlp/extractor/youtube/_base.py, Commit 51bab8a0).
