# Konfiguration fuer bash-guard-snapshot.sh (lib/snapshot_classify.py).
#
# Warum als eigene Datei und nicht als Liste im Code: der Guard feuert bei
# ALLTAGSARBEIT. Was als Wegwerf-Ort gilt, aendert sich mit jedem neuen
# Werkzeug und jedem neuen Projekt -- steht die Liste im Skript, wird der
# Guard beim ersten Fehlalarm abgeschaltet statt nachgezogen. Hier laesst sie
# sich anpassen, ohne die Pruefung selbst anzufassen.
#
# Format: key=value, eine Zuweisung pro Zeile, '#' leitet einen Kommentar ein.
# Unbekannte Schluessel werden ignoriert. Fehlt die Datei, faellt der Hook auf
# die im Skript dokumentierten Vorgaben zurueck (dieselben Werte wie hier).

# --- Wegwerf-Orte: hier ist Loeschen/Ueberschreiben folgenlos ---------------
# Globs im fnmatch-Sinn; '*' passt auch ueber '/' hinweg. Geprueft wird sowohl
# der normalisierte als auch der aufgeloeste Pfad (/tmp ist auf macOS ein
# Symlink nach /private/tmp).

# Scratchpad der Claude-Sessions und alles darunter
exempt_glob=/private/tmp/claude-*
exempt_glob=/tmp/claude-*
# Klassische Temp-Orte inkl. mktemp auf macOS (/var/folders/...)
exempt_glob=/tmp
exempt_glob=/tmp/*
exempt_glob=/private/tmp
exempt_glob=/private/tmp/*
exempt_glob=/var/folders/*
exempt_glob=/private/var/folders/*
exempt_glob=/dev/null

# Abhaengigkeiten und Build-Ausgaben: reproduzierbar, kein Snapshot noetig
exempt_glob=*/node_modules
exempt_glob=*/node_modules/*
exempt_glob=*/__pycache__
exempt_glob=*/__pycache__/*
exempt_glob=*/.venv
exempt_glob=*/.venv/*
exempt_glob=*/dist
exempt_glob=*/dist/*
exempt_glob=*/build
exempt_glob=*/build/*
exempt_glob=*/target/debug/*
exempt_glob=*/target/release/*
exempt_glob=*/.next
exempt_glob=*/.next/*
exempt_glob=*/.pytest_cache
exempt_glob=*/.pytest_cache/*
exempt_glob=*.pyc
exempt_glob=*.o
exempt_glob=*.class

# Modell-Caches: dieselbe Kategorie wie node_modules -- vom Werkzeug verwaltet,
# jederzeit neu ladbar, und ein Byte-Snapshot waere hier das Gegenteil des
# Zwecks: er belegt genau den Platz, den das Loeschen freimachen soll (88 GB am
# 2026-08-10). Vom Nutzer an diesem Tag ausdruecklich freigegeben, nachdem der
# Guard eine von ihm angeordnete Aufraeumaktion blockiert hatte. Was geloescht
# wird, gehoert trotzdem in einen Wiederbeschaffungszettel unter
# ~/.local/trash-snapshots -- Repo-ID, Revision, Groesse.
exempt_glob=*/.cache/huggingface/hub/*
exempt_glob=*/.ollama/models/*
# Dieselbe Kategorie, am 2026-08-11 dazugekommen: die von Hand konvertierten
# MLX-Fassungen. Der Guard blockierte eine vom Nutzer angeordnete Aufraeumaktion
# ("ueberholte modelle koennen alle weg", 47 GB), und ein Byte-Snapshot waere auch
# hier das Gegenteil des Zwecks. Unterschied zu den Caches: Diese Modelle sind
# NICHT jederzeit neu ladbar, sondern kosten 51 GB BF16-Download plus Stunden
# Konvertierung. Deshalb ist der Wiederbeschaffungszettel hier keine Formalie --
# ohne ihn geht die Bauanleitung verloren, nicht nur die Datei.
exempt_glob=*/AI/mlx-models/*

# Git-Interna: von git selbst verwaltet, ein Snapshot davon hilft niemandem
exempt_glob=*/.git/objects/*
exempt_glob=*/.git/index
exempt_glob=*/.git/*.lock

# Laufzeit-Krempel, der staendig neu geschrieben wird
exempt_glob=*.log
exempt_glob=*.pid
exempt_glob=*.lock
exempt_glob=*.tmp
exempt_glob=*/.DS_Store

# --- Snapshot-Erkennung -----------------------------------------------------
# Wohin die stehende Regel kopieren laesst.
snapshot_dir=~/.local/trash-snapshots
# Wie lange ein bereits angelegter Snapshot als "unmittelbar davor" zaehlt.
snapshot_max_age_minutes=120

# --- Mass der Pruefung ------------------------------------------------------
# Unterhalb dieser Groesse (Summe der enthaltenen Dateien) gilt ein Ziel als
# trivial und wird durchgelassen. 1 = jeder nicht-leere Inhalt zaehlt.
min_bytes=1
# Ein Ziel, das vollstaendig und unveraendert in git liegt, ist bereits
# gesichert -- git IST der Snapshot. false schaltet diese Ausnahme ab.
git_committed_is_exempt=true
