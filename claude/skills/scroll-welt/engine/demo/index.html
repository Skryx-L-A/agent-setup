<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>scroll-welt — gemischte Kette: szene, video, still</title>
  <meta name="description" content="Demo der Treiber-Architektur: eine Code-Szene, ein Videoclip mit gelockten Naehten, ein Standbild." />
  <!-- Lets the bare specifier "three" resolve without a bundler. treiber-three.js
       looks for { three } and window.THREE first and only then reaches for
       import('three') — this map is what makes that last branch work here. -->
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
  <style>
    :root, .sw-root {
      --sw-bg: #F5EDE0;
      --sw-ink: #241d2b;
      --sw-ink-soft: #6a6072;
      --sw-accent: #6D9668;
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="welt"></div>

  <script src="../scrub-welt.js"></script>
  <script src="../treiber-parallax.js"></script>
  <script src="../treiber-three.js"></script>
  <script src="scenes.js"></script>
  <script src="szene-halle.js"></script>
  <script>
    // The 3D segment goes in front of the closing still: szene -> video ->
    // szene -> szene(3D) -> still. Between the two code scenes there is no seam
    // to build at all, which is the point the contract makes about code drivers.
    const segments = window.DEMO_SEGMENTS.slice();
    segments.splice(3, 0, window.HALLE_SEGMENT);

    window.welt = mountScrollWelt(document.getElementById('welt'), {
      brand: { name: 'Pearl & Co.', href: '#top' },
      cta: { label: 'Bestellen', href: '#' },
      hint: 'scrollen',
      debug: true,
      segments: segments,
    });

    // Der Schluss haelt bewusst: das letzte Segment ist ein Standbild, und ab
    // dem Punkt, an dem seine Copy ausgeschrieben dasteht, bewegt sich nichts
    // mehr. Das ist kein toter Scroll, aber es muss ERKLAERT werden, sonst kann
    // die Seitenpruefung es nicht von einem unterscheiden. Gelesen wird ein
    // Bild spaeter: die Engine rechnet ihre Deckkraefte in einer rAF-Schleife,
    // wer im Scroll-Handler misst, liest die Werte des vorigen Bildes.
    // Siehe reference/seiten-pruefung.md.
    (function erklaerterSchluss() {
      const schluss = document.querySelector('[data-sw-seg="produkt"]');
      const copy = document.querySelectorAll('.sw-copy')[segments.filter(s => s.copy || s.label || s.title).length - 1];
      if (!schluss) return;
      const lesen = () => {
        const st = window.welt.state().find(s => s.id === 'produkt');
        const co = copy ? (parseFloat(getComputedStyle(copy).opacity) || 0) : 0;
        schluss.setAttribute('data-sw-verify-hold',
          (st && st.opacity > 0.99 && co > 0.999) ? 'true' : 'false');
      };
      addEventListener('scroll', () => requestAnimationFrame(lesen), { passive: true });
      requestAnimationFrame(lesen);
    }());
  </script>
</body>
</html>
