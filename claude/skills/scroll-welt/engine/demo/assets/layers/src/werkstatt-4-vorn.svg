<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="balken" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B4E36"/>
      <stop offset="1" stop-color="#543D2B"/>
    </linearGradient>
  </defs>
  <!-- ceiling beam, close to the lens -->
  <rect x="0" y="0" width="2560" height="132" fill="url(#balken)"/>
  <rect x="0" y="132" width="2560" height="14" fill="#3F2E20" opacity="0.6"/>

  <!-- herbs hanging from the beam -->
  <g stroke="#5F7A4E" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M300 146 C 292 240, 314 300, 300 372"/>
    <path d="M360 146 C 372 250, 350 306, 366 386"/>
    <path d="M2100 146 C 2088 236, 2110 296, 2094 364"/>
  </g>
  <g fill="#6E8C55">
    <ellipse cx="300" cy="372" rx="52" ry="86" transform="rotate(6 300 372)"/>
    <ellipse cx="366" cy="386" rx="44" ry="74" transform="rotate(-8 366 386)"/>
    <ellipse cx="2094" cy="364" rx="50" ry="82" transform="rotate(4 2094 364)"/>
  </g>

  <!-- doorway edge on the left, the frame we look past -->
  <path d="M0 0 H236 C 214 420, 226 900, 250 1440 H0 Z" fill="#4A3627" opacity="0.92"/>
  <!-- crate in the near corner -->
  <g transform="translate(2130 1090)">
    <rect x="0" y="0" width="420" height="290" rx="10" fill="#7E5D40"/>
    <rect x="0" y="104" width="420" height="26" fill="#6B4E36"/>
    <rect x="0" y="206" width="420" height="26" fill="#6B4E36"/>
    <rect x="184" y="0" width="30" height="290" fill="#6B4E36" opacity="0.7"/>
  </g>
</svg>
