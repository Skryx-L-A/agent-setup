<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="platte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C79A6E"/>
      <stop offset="1" stop-color="#A87C56"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7E9E86"/>
      <stop offset="0.35" stop-color="#A8C4AC"/>
      <stop offset="1"   stop-color="#6E8C77"/>
    </linearGradient>
    <linearGradient id="glas2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#B4713F"/>
      <stop offset="0.35" stop-color="#D89A63"/>
      <stop offset="1"   stop-color="#9C5F35"/>
    </linearGradient>
  </defs>

  <!-- workbench -->
  <g transform="translate(400 900)">
    <rect x="0" y="60" width="1760" height="54" rx="8" fill="url(#platte)"/>
    <rect x="0" y="114" width="1760" height="20" fill="#8C6A4A"/>
    <rect x="90"   y="134" width="46" height="300" fill="#8C6A4A"/>
    <rect x="1620" y="134" width="46" height="300" fill="#8C6A4A"/>
    <rect x="90"   y="286" width="1576" height="18" fill="#8C6A4A" opacity="0.8"/>
    <ellipse cx="880" cy="452" rx="900" ry="34" fill="#7A5F45" opacity="0.28"/>
  </g>

  <!-- bottles on the bench -->
  <g transform="translate(560 700)">
    <rect x="0" y="120" width="118" height="240" rx="16" fill="url(#glas)"/>
    <rect x="34" y="52"  width="50"  height="76"  rx="10" fill="url(#glas)"/>
    <rect x="26" y="30"  width="66"  height="30"  rx="9"  fill="#7E5D40"/>
    <rect x="14" y="196" width="90"  height="70"  rx="6"  fill="#F0E6D2" opacity="0.9"/>
  </g>
  <g transform="translate(760 742)">
    <rect x="0" y="96" width="96" height="198" rx="14" fill="url(#glas2)"/>
    <rect x="28" y="40" width="42" height="62" rx="9" fill="url(#glas2)"/>
    <rect x="20" y="20" width="58" height="26" rx="8" fill="#7E5D40"/>
    <rect x="12" y="160" width="72" height="58" rx="6" fill="#F0E6D2" opacity="0.9"/>
  </g>
  <g transform="translate(1300 726)">
    <rect x="0" y="110" width="126" height="224" rx="16" fill="url(#glas)"/>
    <rect x="38" y="44"  width="52"  height="72"  rx="10" fill="url(#glas)"/>
    <rect x="30" y="22"  width="68"  height="28"  rx="8"  fill="#7E5D40"/>
    <rect x="16" y="184" width="94"  height="66"  rx="6"  fill="#F0E6D2" opacity="0.9"/>
  </g>
  <!-- funnel + bowl -->
  <g transform="translate(1560 836)">
    <path d="M0 0 H150 L96 92 V150 H54 V92 Z" fill="#B8AE9C"/>
  </g>
  <g transform="translate(980 880)">
    <path d="M0 0 H210 C 200 74, 168 106, 105 106 C 42 106, 10 74, 0 0 Z" fill="#9FB6A4"/>
    <ellipse cx="105" cy="4" rx="105" ry="18" fill="#B6C9B8"/>
  </g>

  <!-- lamp above the bench -->
  <g transform="translate(1160 300)">
    <rect x="72" y="0" width="8" height="230" fill="#6F6257"/>
    <path d="M0 230 H152 L112 320 H40 Z" fill="#6F6257"/>
    <ellipse cx="76" cy="322" rx="36" ry="12" fill="#FFF0C6"/>
    <ellipse cx="76" cy="380" rx="150" ry="52" fill="#FFF0C6" opacity="0.35"/>
  </g>
</svg>
