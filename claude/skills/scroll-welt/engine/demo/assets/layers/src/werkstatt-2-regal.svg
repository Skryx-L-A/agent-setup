<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="holz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9835E"/>
      <stop offset="1" stop-color="#8C6A4A"/>
    </linearGradient>
  </defs>
  <!-- left shelf unit -->
  <g transform="translate(120 380)">
    <rect x="0" y="0"   width="880" height="26" fill="url(#holz)"/>
    <rect x="0" y="286" width="880" height="26" fill="url(#holz)"/>
    <rect x="0" y="572" width="880" height="26" fill="url(#holz)"/>
    <rect x="-4" y="0" width="18" height="598" fill="#7E5D40"/>
    <rect x="866" y="0" width="18" height="598" fill="#7E5D40"/>

    <!-- jars, top shelf -->
    <g>
      <rect x="70"  y="-118" width="96"  height="118" rx="12" fill="#9FB6A4" opacity="0.9"/>
      <rect x="82"  y="-136" width="72"  height="26"  rx="8"  fill="#7E5D40"/>
      <rect x="210" y="-152" width="110" height="152" rx="14" fill="#C2A98C" opacity="0.92"/>
      <rect x="224" y="-172" width="82"  height="28"  rx="8"  fill="#7E5D40"/>
      <rect x="372" y="-100" width="88"  height="100" rx="10" fill="#B4795E" opacity="0.9"/>
      <rect x="520" y="-140" width="104" height="140" rx="12" fill="#8FA3AE" opacity="0.85"/>
      <rect x="534" y="-160" width="76"  height="26"  rx="8"  fill="#7E5D40"/>
      <rect x="676" y="-112" width="92"  height="112" rx="12" fill="#C9B27E" opacity="0.9"/>
    </g>
    <!-- middle shelf -->
    <g>
      <rect x="46"  y="150" width="128" height="136" rx="14" fill="#B98C63" opacity="0.9"/>
      <rect x="216" y="176" width="96"  height="110" rx="10" fill="#9FB6A4" opacity="0.88"/>
      <rect x="352" y="140" width="112" height="146" rx="12" fill="#CDB894" opacity="0.9"/>
      <rect x="502" y="186" width="86"  height="100" rx="10" fill="#B4795E" opacity="0.88"/>
      <rect x="628" y="156" width="120" height="130" rx="12" fill="#8FA3AE" opacity="0.82"/>
      <rect x="780" y="196" width="72"  height="90"  rx="9"  fill="#C9B27E" opacity="0.9"/>
    </g>
    <!-- bottom shelf: crates -->
    <g fill="#A9835E">
      <rect x="40"  y="430" width="230" height="142" rx="6"/>
      <rect x="300" y="450" width="200" height="122" rx="6"/>
      <rect x="536" y="424" width="250" height="148" rx="6"/>
    </g>
    <g stroke="#8C6A4A" stroke-width="7" opacity="0.8">
      <path d="M40 486 H270 M300 500 H500 M536 482 H786"/>
    </g>
  </g>

  <!-- right hanging rail with tools -->
  <g transform="translate(2050 300)">
    <rect x="0" y="0" width="420" height="18" fill="#7E5D40"/>
    <g stroke="#6F6257" stroke-width="12" stroke-linecap="round">
      <path d="M60 18 V150 M160 18 V190 M270 18 V132 M360 18 V172"/>
    </g>
    <g fill="#6F6257">
      <circle cx="60"  cy="168" r="30"/>
      <rect x="130" y="190" width="62" height="70" rx="8"/>
      <circle cx="270" cy="152" r="26"/>
      <rect x="332" y="172" width="56" height="56" rx="6"/>
    </g>
  </g>
</svg>
